name: Verify CareConnect
on: [push, pull_request]
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python -m pytest -q
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test && pnpm build
        working-directory: frontend
      - name: Run browser workflows
        run: |
          python backend/manage.py migrate
          python backend/manage.py seed_demo
          python backend/manage.py runserver 127.0.0.1:8000 --noreload &
          cd frontend
          pnpm exec playwright install --with-deps chromium
          pnpm dev --host 127.0.0.1 --strictPort &
          for tries in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/api/healthcheck/; then break; fi
            sleep 1
          done
          pnpm e2e
